# Enable Gradle build cache for faster subsequent builds
org.gradle.caching=true

# Run independent tasks in parallel
org.gradle.parallel=true

# Keep Gradle daemon alive between builds
org.gradle.daemon=true

# Increase memory for faster compilation
org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError

# Only configure projects that are needed
org.gradle.configureondemand=true
